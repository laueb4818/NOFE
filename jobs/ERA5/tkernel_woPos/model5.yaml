kind: Job
apiVersion: batch/v1
metadata:
  name: nofe-era5-model5-tkernel
spec:
  template:
    spec:
      tolerations:
      - key: "vram"
        operator: "Equal"
        value: "high"
      #nodeSelector:
      #  springfield.uit.no/gpu-type: "rtx-A6000"  
      #gtx-1080-ti, rtx-2080-ti, rtx-3090, or rtx-A6000 
        effect: "NoSchedule"
      hostIPC: true
      containers:
      - name: nofe-era5-model5-tkernel
        image: "laueb4818/neural-operators-new3:latest"
        workingDir: /storage3/NOFE/src
        command: ["/bin/bash", "-c"]
        args: ["python train_standard.py ERA5/test1_model5_median_tkernel --wandb"] # 
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb
              key: apikey
        volumeMounts:
        - name: storage
          mountPath: /storage
        - name: storage2
          mountPath: /storage2
        - name: storage3
          mountPath: /storage3
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
        - name: storage2
          persistentVolumeClaim:
            claimName: storage2
        - name: storage3
          persistentVolumeClaim:
            claimName: storage3
      restartPolicy: OnFailure
  backoffLimit: 0
