kind: Job
apiVersion: batch/v1
metadata:
  name: download-modis-data-2018
spec:
  template:
    spec:
      tolerations:
      - key: "vram"
        operator: "Equal"
        value: "high"
        effect: "NoSchedule"
      nodeSelector:
        springfield.uit.no/gpu-type: "gtx-1080-ti"  
      #gtx-1080-ti, rtx-2080-ti, rtx-3090, or rtx-A6000 
      hostIPC: true
      containers:
      - name: download-modis-data-2018
        image: "debian:bookworm-slim"  #"pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime"
        workingDir: /storage3/NOFE/modis_himalaya/data/
        command: ["/bin/bash", "-c"]
        args:
            - >
              apt-get update &&
              apt-get install -y lftp &&
              lftp ftp://ftp.nr.no -e 'mirror --continue --parallel=1 --include-glob "*2017*" /outgoing/jooutgoing/knowearth/modis_data/himalaya ./; bye'
        #stdin: true
        #tty: true
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb
              key: apikey
        volumeMounts:
        - name: storage
          mountPath: /storage
        - name: storage2
          mountPath: /storage2
        - name: storage3
          mountPath: /storage3
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
        - name: storage2
          persistentVolumeClaim:
            claimName: storage2
        - name: storage3
          persistentVolumeClaim:
            claimName: storage3
      restartPolicy: OnFailure
  backoffLimit: 0


